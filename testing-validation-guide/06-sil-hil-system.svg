<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">SIL、HIL与整机测试分工</title><desc id="desc">从单元测试到软件在环、硬件在环和整机确认，执行次数逐渐减少但真实度和单次成本逐渐增加。</desc>
  <defs><style>.bg{fill:#0b1220}.t{fill:#f8fafc;font:700 27px sans-serif}.s{fill:#cbd5e1;font:18px sans-serif}.m{fill:#94a3b8;font:16px sans-serif}.u{fill:#17324d;stroke:#38bdf8;stroke-width:2}.sil{fill:#17433c;stroke:#34d399;stroke-width:2}.hil{fill:#4a351a;stroke:#fbbf24;stroke-width:2}.sys{fill:#43234d;stroke:#e879f9;stroke-width:2}.arr{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1200" height="680" rx="24"/><text class="t" x="60" y="65">越靠近真实设备，越贵；越靠近代码，越适合多跑</text>
  <rect class="u" x="55" y="145" width="235" height="280" rx="18"/><text class="t" x="172" y="195" text-anchor="middle">单元 / 组件</text><text class="s" x="172" y="245" text-anchor="middle">毫秒到秒</text><text class="s" x="172" y="285" text-anchor="middle">每次提交运行</text><text class="s" x="172" y="325" text-anchor="middle">定位快</text><text class="m" x="172" y="380" text-anchor="middle">回答：代码逻辑对吗？</text>
  <rect class="sil" x="340" y="145" width="235" height="280" rx="18"/><text class="t" x="457" y="195" text-anchor="middle">SIL</text><text class="s" x="457" y="245" text-anchor="middle">大量场景组合</text><text class="s" x="457" y="285" text-anchor="middle">网络 / 时序仿真</text><text class="s" x="457" y="325" text-anchor="middle">回归成本低</text><text class="m" x="457" y="380" text-anchor="middle">回答：软件系统对吗？</text>
  <rect class="hil" x="625" y="145" width="235" height="280" rx="18"/><text class="t" x="742" y="195" text-anchor="middle">HIL</text><text class="s" x="742" y="245" text-anchor="middle">真实控制器 / 驱动</text><text class="s" x="742" y="285" text-anchor="middle">物理时延与故障</text><text class="s" x="742" y="325" text-anchor="middle">执行次数有限</text><text class="m" x="742" y="380" text-anchor="middle">回答：软硬件配合好吗？</text>
  <rect class="sys" x="910" y="145" width="235" height="280" rx="18"/><text class="t" x="1027" y="195" text-anchor="middle">整机 / 确认</text><text class="s" x="1027" y="245" text-anchor="middle">真实工作流</text><text class="s" x="1027" y="285" text-anchor="middle">用户与使用环境</text><text class="s" x="1027" y="325" text-anchor="middle">成本最高</text><text class="m" x="1027" y="380" text-anchor="middle">回答：现场真的可用吗？</text>
  <path class="arr" d="M140 500 H1050"/><text class="s" x="150" y="545">运行次数多、反馈快</text><text class="s" x="875" y="545">真实度高、成本高</text>
  <text class="m" x="60" y="615">正确分工：SIL 扫过大量组合，HIL 专注硬件特性和高风险边界，整机确认真实工作流。</text>
</svg>
