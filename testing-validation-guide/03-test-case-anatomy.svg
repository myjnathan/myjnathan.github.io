<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">一个可复现测试的组成</title><desc id="desc">测试从明确目的开始，记录前置条件和刺激，观察独立测量结果，与可量化预期比较，并保存环境与原始证据。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55aaff"/></marker><style>text{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#e6edf7}.t{font-size:30px;font-weight:700}.s{font-size:15px;fill:#9fb0c8}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#b7c5d9}.n{fill:#111c33;stroke:#2d4266;stroke-width:2}.g{fill:#10283a;stroke:#34d399;stroke-width:2}.f{stroke:#55aaff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="700" rx="24" fill="#0b1220"/><text x="52" y="58" class="t">一个测试要能重跑，也要能让别人相信</text><text x="52" y="88" class="s">“我试了一下没问题”缺少条件、观察量和原始证据，无法支持发布判断。</text>
  <rect x="52" y="148" width="190" height="122" rx="16" class="n"/><text x="76" y="187" class="h">① 目的</text><text x="76" y="220" class="b">要证明哪条要求</text><text x="76" y="247" class="b">要防住哪种失败</text>
  <rect x="278" y="148" width="190" height="122" rx="16" class="n"/><text x="302" y="187" class="h">② 前置条件</text><text x="302" y="220" class="b">版本、配置、设备</text><text x="302" y="247" class="b">初始状态和数据</text>
  <rect x="504" y="148" width="190" height="122" rx="16" class="n"/><text x="528" y="187" class="h">③ 刺激</text><text x="528" y="220" class="b">输入、操作或故障</text><text x="528" y="247" class="b">时间与重复方式</text>
  <rect x="730" y="148" width="190" height="122" rx="16" class="g"/><text x="754" y="187" class="h">④ 观察</text><text x="754" y="220" class="b">状态、输出、测量</text><text x="754" y="247" class="b">不要只看一个 UI</text>
  <rect x="956" y="148" width="192" height="122" rx="16" class="g"/><text x="980" y="187" class="h">⑤ 预期</text><text x="980" y="220" class="b">通过标准可量化</text><text x="980" y="247" class="b">失败时如何停止</text><path d="M242 209H270M468 209H496M694 209H722M920 209H948" class="f"/>
  <rect x="52" y="342" width="1096" height="180" rx="18" class="n"/><text x="78" y="383" class="h">证据包</text><text x="78" y="421" class="b">测试用例版本　·　commit 与制品摘要　·　OS/设备/仪器/配置版本　·　原始日志和测量数据</text><text x="78" y="458" class="b">首次失败和重试记录　·　操作者与时间　·　自动判定结果　·　人工观察与偏差说明</text><line x1="78" y1="482" x2="1120" y2="482" stroke="#2d4266"/><text x="78" y="507" class="s">任何人拿到相同制品、环境和步骤，都应能得到相同结论。</text>
  <text x="52" y="590" class="h">坏问题</text><text x="174" y="590" class="b">“断网恢复正常吗？”</text><text x="52" y="632" class="h">可测问题</text><text x="174" y="632" class="b">“恢复并同步后、医生确认前，远程输入是否始终不能驱动从手？”</text>
</svg>
