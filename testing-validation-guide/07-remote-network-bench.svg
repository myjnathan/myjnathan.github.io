<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">远程手术网络测试台架</title><desc id="desc">医生侧与患者侧之间经过可控网络扰动器，同时由独立测量设备记录系统内外的时延、状态和安全行为。</desc>
  <defs><style>.bg{fill:#0b1220}.box{fill:#172033;stroke:#64748b;stroke-width:2}.net{fill:#3d2c14;stroke:#f59e0b;stroke-width:2}.safe{fill:#123c50;stroke:#38bdf8;stroke-width:2}.obs{fill:#14352f;stroke:#34d399;stroke-width:2}.t{fill:#f8fafc;font:700 25px sans-serif}.s{fill:#cbd5e1;font:18px sans-serif}.m{fill:#94a3b8;font:16px sans-serif}.line{stroke:#94a3b8;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>
  <rect class="bg" width="1200" height="720" rx="24"/><text class="t" x="60" y="60">远程手术网络测试：既看网络，也看系统最后做了什么</text>
  <rect class="safe" x="55" y="145" width="220" height="190" rx="18"/><text class="t" x="165" y="190" text-anchor="middle">医生侧</text><text class="s" x="165" y="235" text-anchor="middle">主手 / 控制台</text><text class="s" x="165" y="275" text-anchor="middle">视频 / 控制指令</text><text class="m" x="165" y="315" text-anchor="middle">记录发送时刻与状态</text>
  <rect class="net" x="360" y="120" width="300" height="240" rx="18"/><text class="t" x="510" y="170" text-anchor="middle">可控网络扰动</text><text class="s" x="510" y="215" text-anchor="middle">时延 · 抖动 · 丢包</text><text class="s" x="510" y="255" text-anchor="middle">乱序 · 限速 · 断连</text><text class="s" x="510" y="295" text-anchor="middle">恢复 · 反复抖动</text><text class="m" x="510" y="335" text-anchor="middle">每次实验保存条件配置</text>
  <rect class="safe" x="745" y="145" width="220" height="190" rx="18"/><text class="t" x="855" y="190" text-anchor="middle">患者侧</text><text class="s" x="855" y="235" text-anchor="middle">从手 / 控制器</text><text class="s" x="855" y="275" text-anchor="middle">安全状态 / 运动</text><text class="m" x="855" y="315" text-anchor="middle">记录接收与执行时刻</text>
  <path class="line" d="M275 240 H350"/><path class="line" d="M660 240 H735"/>
  <rect class="obs" x="300" y="440" width="420" height="180" rx="18"/><text class="t" x="510" y="485" text-anchor="middle">独立测量与交叉核验</text><text class="s" x="510" y="530" text-anchor="middle">抓包 · 外部时钟 · 位置 / 视频采集</text><text class="s" x="510" y="570" text-anchor="middle">不只相信系统自己打印的日志</text><path class="line" d="M165 345 V405 H420 V430"/><path class="line" d="M855 345 V405 H600 V430"/>
  <rect class="box" x="790" y="430" width="350" height="205" rx="18"/><text class="t" x="965" y="475" text-anchor="middle">四类结果一起判断</text><text class="s" x="825" y="520">① 网络：实际时延与丢包</text><text class="s" x="825" y="555">② 控制：误差与稳定性</text><text class="s" x="825" y="590">③ 安全：切换与恢复行为</text><text class="s" x="825" y="625">④ 人因：告警能否理解</text>
  <text class="m" x="60" y="680">条件至少覆盖：典型、边界、超边界、故障恢复；每组都要重复，不能只挑一次漂亮结果。</text>
</svg>
