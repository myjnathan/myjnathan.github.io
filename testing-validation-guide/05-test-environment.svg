<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">生产级测试环境结构</title><desc id="desc">代码经过持续集成后分别进入Windows、Linux、Docker和实验室硬件环境，统一收集日志、配置和测试报告。</desc>
  <defs><style>.bg{fill:#0b1220}.box{fill:#172033;stroke:#5f75a8;stroke-width:2}.hi{fill:#123c50;stroke:#38bdf8;stroke-width:2}.lab{fill:#342352;stroke:#c084fc;stroke-width:2}.out{fill:#14352f;stroke:#34d399;stroke-width:2}.t{fill:#f8fafc;font:700 25px sans-serif}.s{fill:#cbd5e1;font:18px sans-serif}.m{fill:#94a3b8;font:16px sans-serif}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect class="bg" width="1200" height="680" rx="24"/><text class="t" x="60" y="65">测试机不是“另一台电脑”，而是一套可重复的环境</text>
  <rect class="hi" x="55" y="125" width="220" height="115" rx="16"/><text class="t" x="165" y="170" text-anchor="middle">代码与制品</text><text class="s" x="165" y="205" text-anchor="middle">固定版本 · 可追溯</text>
  <rect class="box" x="360" y="125" width="220" height="115" rx="16"/><text class="t" x="470" y="170" text-anchor="middle">CI 调度器</text><text class="s" x="470" y="205" text-anchor="middle">分配任务 · 保存结果</text><path class="line" d="M275 182 H350"/>
  <rect class="box" x="680" y="95" width="205" height="100" rx="14"/><text class="t" x="782" y="138" text-anchor="middle">Windows</text><text class="m" x="782" y="169" text-anchor="middle">服务 / 驱动 / 安装包</text>
  <rect class="box" x="680" y="220" width="205" height="100" rx="14"/><text class="t" x="782" y="263" text-anchor="middle">Linux</text><text class="m" x="782" y="294" text-anchor="middle">服务 / 权限 / systemd</text>
  <rect class="box" x="680" y="345" width="205" height="100" rx="14"/><text class="t" x="782" y="388" text-anchor="middle">Docker</text><text class="m" x="782" y="419" text-anchor="middle">镜像 / 网络 / 挂载</text>
  <rect class="lab" x="680" y="470" width="205" height="100" rx="14"/><text class="t" x="782" y="513" text-anchor="middle">实验室 / HIL</text><text class="m" x="782" y="544" text-anchor="middle">真实设备与故障注入</text>
  <path class="line" d="M580 182 H630 V145 H670"/><path class="line" d="M630 182 V270 H670"/><path class="line" d="M630 270 V395 H670"/><path class="line" d="M630 395 V520 H670"/>
  <rect class="out" x="965" y="190" width="180" height="295" rx="18"/><text class="t" x="1055" y="235" text-anchor="middle">统一证据</text><text class="s" x="1055" y="285" text-anchor="middle">测试报告</text><text class="s" x="1055" y="325" text-anchor="middle">日志与指标</text><text class="s" x="1055" y="365" text-anchor="middle">环境配置</text><text class="s" x="1055" y="405" text-anchor="middle">软件 / 固件版本</text><text class="s" x="1055" y="445" text-anchor="middle">失败现场</text>
  <path class="line" d="M885 145 H925 V250 H955"/><path class="line" d="M885 270 H955"/><path class="line" d="M885 395 H955"/><path class="line" d="M885 520 H925 V450 H955"/>
  <text class="m" x="60" y="630">关键做法：环境声明成配置、每次从干净状态开始、结果带上版本和机器身份。</text>
</svg>
