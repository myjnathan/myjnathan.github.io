<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Actions 与 GitLab CI 能力映射</title><desc id="desc">同一生产交付模型在 GitHub 与 GitLab 中使用不同名称实现，包括流水线、执行器、制品、环境和保护规则。</desc>
  <defs><style>text{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#e6edf7}.t{font-size:30px;font-weight:700}.s{font-size:15px;fill:#9fb0c8}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#b7c5d9}.head{fill:#10283a;stroke:#34d399;stroke-width:2}.cell{fill:#111c33;stroke:#2d4266;stroke-width:1.5}.mid{fill:#211b3b;stroke:#a78bfa;stroke-width:1.5}</style></defs>
  <rect width="1200" height="720" rx="24" fill="#0b1220"/><text x="52" y="58" class="t">GitHub 与 GitLab：控制模型相同，平台名词不同</text><text x="52" y="88" class="s">先设计阶段、证据和权限，再把它翻译成平台对象；不要让 YAML 语法反过来决定交付架构。</text>
  <rect x="52" y="126" width="310" height="66" rx="14" class="head"/><text x="78" y="167" class="h">生产交付概念</text><rect x="378" y="126" width="360" height="66" rx="14" class="head"/><text x="404" y="167" class="h">GitHub Actions</text><rect x="754" y="126" width="394" height="66" rx="14" class="head"/><text x="780" y="167" class="h">GitLab CI/CD</text>
  <g><rect x="52" y="208" width="310" height="66" class="mid"/><text x="78" y="248" class="h">流水线定义</text><rect x="378" y="208" width="360" height="66" class="cell"/><text x="404" y="248" class="b">Workflow → Jobs → Steps</text><rect x="754" y="208" width="394" height="66" class="cell"/><text x="780" y="248" class="b">Pipeline → Stages → Jobs</text></g>
  <g><rect x="52" y="284" width="310" height="66" class="mid"/><text x="78" y="324" class="h">执行机器</text><rect x="378" y="284" width="360" height="66" class="cell"/><text x="404" y="324" class="b">GitHub-hosted / self-hosted runner</text><rect x="754" y="284" width="394" height="66" class="cell"/><text x="780" y="324" class="b">GitLab Runner + executor</text></g>
  <g><rect x="52" y="360" width="310" height="66" class="mid"/><text x="78" y="400" class="h">短期 Job 产物</text><rect x="378" y="360" width="360" height="66" class="cell"/><text x="404" y="400" class="b">upload-artifact / download-artifact</text><rect x="754" y="360" width="394" height="66" class="cell"/><text x="780" y="400" class="b">job artifacts + needs</text></g>
  <g><rect x="52" y="436" width="310" height="66" class="mid"/><text x="78" y="476" class="h">正式制品</text><rect x="378" y="436" width="360" height="66" class="cell"/><text x="404" y="476" class="b">Packages / GHCR / Releases</text><rect x="754" y="436" width="394" height="66" class="cell"/><text x="780" y="476" class="b">Package / Container Registry</text></g>
  <g><rect x="52" y="512" width="310" height="66" class="mid"/><text x="78" y="552" class="h">环境与审批</text><rect x="378" y="512" width="360" height="66" class="cell"/><text x="404" y="552" class="b">Environment + required reviewers</text><rect x="754" y="512" width="394" height="66" class="cell"/><text x="780" y="552" class="b">Environment + protected environment</text></g>
  <g><rect x="52" y="588" width="310" height="66" class="mid"/><text x="78" y="628" class="h">串行化生产部署</text><rect x="378" y="588" width="360" height="66" class="cell"/><text x="404" y="628" class="b">concurrency</text><rect x="754" y="588" width="394" height="66" class="cell"/><text x="780" y="628" class="b">resource_group</text></g>
  <text x="52" y="692" class="s">平台迁移时保持不变的是：制品摘要、质量门、权限边界、环境入口条件、停止条件和恢复证据。</text>
</svg>
