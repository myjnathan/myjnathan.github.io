<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">CI/CD 环境与网络拓扑</title><desc id="desc">平台、构建区、测试实验室、发布管理区和生产区按信任等级隔离，制品逐级晋级，生产不执行不可信代码。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55aaff"/></marker><style>text{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#e6edf7}.t{font-size:30px;font-weight:700}.s{font-size:15px;fill:#9fb0c8}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#b7c5d9}.lane{font-size:14px;font-weight:700;fill:#55aaff}.z{fill:#111c33;stroke:#2d4266;stroke-width:2}.g{fill:#10283a;stroke:#34d399;stroke-width:2}.p{fill:#211b3b;stroke:#a78bfa;stroke-width:2}.f{stroke:#55aaff;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#66758d;stroke-width:2;stroke-dasharray:7 7;fill:none}</style></defs>
  <rect width="1200" height="760" rx="24" fill="#0b1220"/><text x="52" y="58" class="t">环境拓扑：权限随流水线向生产逐级收紧</text><text x="52" y="88" class="s">SaaS 平台负责调度；内网 Runner 主动取任务；生产区不直接暴露给互联网，也不执行普通 PR 代码。</text>
  <text x="52" y="130" class="lane">外部控制面</text><rect x="52" y="148" width="1096" height="82" rx="16" class="z"/><text x="78" y="183" class="h">GitHub / GitLab</text><text x="270" y="183" class="b">仓库 · PR/MR · 分支保护 · Pipeline 调度 · Environment 审批</text><text x="78" y="211" class="s">只向 Runner 分配任务，不直接登录生产机</text>
  <path d="M240 230V277M600 230V277M960 230V277" class="d"/>
  <text x="52" y="275" class="lane">CI 构建区</text><rect x="52" y="293" width="314" height="156" rx="16" class="z"/><text x="78" y="332" class="h">Build Runner</text><text x="78" y="365" class="b">编译、单测、扫描</text><text x="78" y="394" class="b">无生产网络与密钥</text><text x="78" y="423" class="s">输出：候选制品 + 证据</text>
  <text x="443" y="275" class="lane">测试与设备实验室</text><rect x="443" y="293" width="314" height="156" rx="16" class="g"/><text x="469" y="332" class="h">Test-lab Runner</text><text x="469" y="365" class="b">Windows / Linux 测试机</text><text x="469" y="394" class="b">SIL / HIL / 网络故障注入</text><text x="469" y="423" class="s">无生产证书</text>
  <text x="834" y="275" class="lane">发布管理区</text><rect x="834" y="293" width="314" height="156" rx="16" class="p"/><text x="860" y="332" class="h">Release Runner</text><text x="860" y="365" class="b">只接受 protected ref</text><text x="860" y="394" class="b">写 NAS / Registry、执行部署</text><text x="860" y="423" class="s">专用最小权限账号</text>
  <path d="M366 371H435M757 371H826" class="f"/>
  <text x="52" y="506" class="lane">制品与生产区</text><rect x="52" y="524" width="314" height="150" rx="16" class="p"/><text x="78" y="563" class="h">NAS / Package / Registry</text><text x="78" y="596" class="b">不可变版本、摘要、SBOM</text><text x="78" y="625" class="b">只增不改 + 快照 + 审计</text>
  <rect x="443" y="524" width="314" height="150" rx="16" class="g"/><text x="469" y="563" class="h">Canary / 预生产</text><text x="469" y="596" class="b">同一 digest、真实部署动作</text><text x="469" y="625" class="b">健康、迁移和回滚演练</text>
  <rect x="834" y="524" width="314" height="150" rx="16" class="g"/><text x="860" y="563" class="h">Production</text><text x="860" y="596" class="b">不拉源码、不现场编译</text><text x="860" y="625" class="b">灰度放量 + 部署回执</text>
  <path d="M991 449C991 482 209 475 209 516M366 599H435M757 599H826" class="f"/><text x="52" y="716" class="s">推荐连接方向：Runner 主动访问目标；生产机仅开放最小管理端口。Build、Test、Release 使用不同身份和 Runner 标签。</text>
</svg>
