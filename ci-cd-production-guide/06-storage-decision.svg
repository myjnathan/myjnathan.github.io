<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">制品存储选择图</title><desc id="desc">根据制品类型和使用方式，在 CI Artifact、Package Registry、Container Registry、NAS 与对象存储之间选择。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55aaff"/></marker><style>text{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#e6edf7}.t{font-size:30px;font-weight:700}.s{font-size:15px;fill:#9fb0c8}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#b7c5d9}.q{fill:#111c33;stroke:#55aaff;stroke-width:2}.n{fill:#111c33;stroke:#2d4266;stroke-width:2}.g{fill:#10283a;stroke:#34d399;stroke-width:2}.p{fill:#211b3b;stroke:#a78bfa;stroke-width:2}.f{stroke:#55aaff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="740" rx="24" fill="#0b1220"/><text x="52" y="58" class="t">制品放哪里？先看对象和生命周期</text><text x="52" y="88" class="s">这些存储不是互斥选项：平台负责流水线中转，Registry 负责在线分发，NAS/对象存储负责长期与离线归档。</text>
  <rect x="420" y="128" width="360" height="86" rx="16" class="q"/><text x="455" y="165" class="h">它只用于 Job 间传递和失败调试？</text><text x="455" y="191" class="s">保留期短，可随流水线清理</text>
  <path d="M780 171H942" class="f"/><text x="820" y="157" class="s">是</text><rect x="950" y="128" width="198" height="86" rx="16" class="n"/><text x="974" y="165" class="h">CI Artifact</text><text x="974" y="191" class="b">临时中转</text>
  <path d="M600 214V276" class="f"/><text x="615" y="251" class="s">否</text><rect x="420" y="284" width="360" height="86" rx="16" class="q"/><text x="455" y="321" class="h">它是 Docker / OCI 镜像？</text><text x="455" y="347" class="s">按 digest 拉取、分层存储</text>
  <path d="M780 327H942" class="f"/><text x="820" y="313" class="s">是</text><rect x="950" y="284" width="198" height="86" rx="16" class="g"/><text x="974" y="321" class="h">Container Registry</text><text x="974" y="347" class="b">GitLab / GHCR / Harbor</text>
  <path d="M600 370V432" class="f"/><text x="615" y="407" class="s">否</text><rect x="420" y="440" width="360" height="86" rx="16" class="q"/><text x="455" y="477" class="h">它是团队依赖或需 API 版本管理？</text><text x="455" y="503" class="s">NuGet / npm / Maven / Generic Package</text>
  <path d="M420 483H258" class="f"/><text x="335" y="469" class="s">是</text><rect x="52" y="440" width="198" height="86" rx="16" class="g"/><text x="76" y="477" class="h">Package Registry</text><text x="76" y="503" class="b">依赖与正式安装包</text>
  <path d="M600 526V588" class="f"/><text x="615" y="563" class="s">否</text><rect x="420" y="596" width="360" height="86" rx="16" class="q"/><text x="455" y="633" class="h">需要内网共享、离线交付或大容量归档？</text><text x="455" y="659" class="s">Windows/Linux/固件/现场包</text>
  <path d="M420 639H258" class="f"/><text x="335" y="625" class="s">中小规模</text><rect x="52" y="596" width="198" height="86" rx="16" class="p"/><text x="76" y="633" class="h">NAS</text><text x="76" y="659" class="b">SMB / NFS</text>
  <path d="M780 639H942" class="f"/><text x="813" y="625" class="s">跨地域/对象锁</text><rect x="950" y="596" width="198" height="86" rx="16" class="p"/><text x="974" y="633" class="h">对象存储</text><text x="974" y="659" class="b">S3 兼容 API</text>
  <text x="52" y="718" class="s">推荐组合：CI Artifact（短期） + Registry（在线发布） + NAS/对象存储（长期、离线、灾备）。任何正式制品都要绑定摘要。</text>
</svg>
