<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">CI/CD 软件交付系统全景图</title><desc id="desc">代码变更经过控制、执行、制品、部署和观测五个环节，最终成为可验证且可恢复的生产状态。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55aaff"/></marker><style>text{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#e6edf7}.t{font-size:30px;font-weight:700}.s{font-size:15px;fill:#9fb0c8}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#b7c5d9}.n{fill:#111c33;stroke:#2d4266;stroke-width:2}.g{fill:#10283a;stroke:#34d399;stroke-width:2}.p{fill:#211b3b;stroke:#a78bfa;stroke-width:2}.f{stroke:#55aaff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="700" rx="24" fill="#0b1220"/><text x="52" y="58" class="t">CI/CD：把源码状态转换为可验证的生产状态</text><text x="52" y="88" class="s">不是一份 YAML，而是从变更意图到运行反馈的受控状态机。</text>
  <rect x="52" y="135" width="190" height="130" rx="16" class="n"/><text x="76" y="173" class="h">源码与意图</text><text x="76" y="205" class="b">commit / PR / 需求</text><text x="76" y="233" class="b">依赖锁定与测试代码</text>
  <rect x="282" y="135" width="190" height="130" rx="16" class="g"/><text x="306" y="173" class="h">自动验证</text><text x="306" y="205" class="b">编译、测试、扫描</text><text x="306" y="233" class="b">失败立即停止</text>
  <rect x="512" y="135" width="190" height="130" rx="16" class="p"/><text x="536" y="173" class="h">不可变制品</text><text x="536" y="205" class="b">包 / 固件 / 镜像</text><text x="536" y="233" class="b">digest + SBOM + 签名</text>
  <rect x="742" y="135" width="190" height="130" rx="16" class="g"/><text x="766" y="173" class="h">受控部署</text><text x="766" y="205" class="b">测试 → 预生产 → 灰度</text><text x="766" y="233" class="b">审批同一制品</text>
  <rect x="972" y="135" width="176" height="130" rx="16" class="n"/><text x="996" y="173" class="h">运行反馈</text><text x="996" y="205" class="b">健康、SLO、审计</text><text x="996" y="233" class="b">放量或恢复</text><path d="M242 200H274M472 200H504M702 200H734M932 200H964" class="f"/>
  <text x="52" y="330" class="s">每一层都必须回答一个不同问题</text>
  <rect x="52" y="360" width="205" height="180" rx="16" class="n"/><text x="76" y="398" class="h">变更控制面</text><text x="76" y="430" class="b">谁提出、谁审查？</text><text x="76" y="458" class="b">哪些检查不可绕过？</text><text x="76" y="494" class="s">GitHub / GitLab</text>
  <rect x="275" y="360" width="205" height="180" rx="16" class="n"/><text x="299" y="398" class="h">执行平面</text><text x="299" y="430" class="b">在哪台 Runner 执行？</text><text x="299" y="458" class="b">它拥有哪些权限？</text><text x="299" y="494" class="s">Build / Test / Release</text>
  <rect x="498" y="360" width="205" height="180" rx="16" class="p"/><text x="522" y="398" class="h">制品平面</text><text x="522" y="430" class="b">交付对象是什么？</text><text x="522" y="458" class="b">如何证明未被替换？</text><text x="522" y="494" class="s">Registry / NAS</text>
  <rect x="721" y="360" width="205" height="180" rx="16" class="n"/><text x="745" y="398" class="h">部署平面</text><text x="745" y="430" class="b">如何改变目标状态？</text><text x="745" y="458" class="b">如何控制影响半径？</text><text x="745" y="494" class="s">SSH / WinRM / OTA</text>
  <rect x="944" y="360" width="204" height="180" rx="16" class="g"/><text x="968" y="398" class="h">观测审计面</text><text x="968" y="430" class="b">是否真的成功？</text><text x="968" y="458" class="b">出错后如何恢复？</text><text x="968" y="494" class="s">Metrics / Logs / Receipt</text>
  <rect x="52" y="588" width="1096" height="62" rx="14" fill="#10283a" stroke="#34d399"/><text x="76" y="626" class="h">最终输出：可定位的制品 + 可验证的运行状态 + 可执行的恢复路径</text>
</svg>
