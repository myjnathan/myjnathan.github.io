<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">为什么需要 CI/CD</title><desc id="desc">对比手工大批次发布与自动化小批次交付，展示反馈时间、不确定性、影响半径和恢复成本的差异。</desc>
  <defs><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#fb7185"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#34d399"/></marker><style>text{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#e6edf7}.t{font-size:30px;font-weight:700}.s{font-size:15px;fill:#9fb0c8}.h{font-size:20px;font-weight:700}.b{font-size:15px;fill:#b7c5d9}.bad{fill:#2d1725;stroke:#fb7185;stroke-width:2}.good{fill:#10283a;stroke:#34d399;stroke-width:2}.fr{stroke:#fb7185;stroke-width:3;fill:none;marker-end:url(#r)}.fg{stroke:#34d399;stroke-width:3;fill:none;marker-end:url(#g)}</style></defs>
  <rect width="1200" height="700" rx="24" fill="#0b1220"/><text x="52" y="58" class="t">Why：把晚反馈的大事故，拆成早反馈的小修正</text><text x="52" y="88" class="s">CI/CD 的首要价值是降低不确定性与故障半径，而不只是减少人工点击。</text>
  <text x="52" y="142" class="h" fill="#fb7185">手工大批次：反馈晚、状态不可重建</text>
  <rect x="52" y="166" width="180" height="96" rx="14" class="bad"/><text x="76" y="201" class="h">多周开发</text><text x="76" y="231" class="b">大量变化堆积</text><rect x="292" y="166" width="180" height="96" rx="14" class="bad"/><text x="316" y="201" class="h">集中测试</text><text x="316" y="231" class="b">难以定位根因</text><rect x="532" y="166" width="180" height="96" rx="14" class="bad"/><text x="556" y="201" class="h">重新打包</text><text x="556" y="231" class="b">测试包 ≠ 生产包</text><rect x="772" y="166" width="180" height="96" rx="14" class="bad"/><text x="796" y="201" class="h">一次全量</text><text x="796" y="231" class="b">影响半径最大</text><rect x="1012" y="166" width="136" height="96" rx="14" class="bad"/><text x="1032" y="201" class="h">事故</text><text x="1032" y="231" class="b">临时想回滚</text><path d="M232 214H284M472 214H524M712 214H764M952 214H1004" class="fr"/>
  <text x="52" y="330" class="h" fill="#34d399">自动小批次：每一步都产生证据与停止点</text>
  <rect x="52" y="354" width="180" height="96" rx="14" class="good"/><text x="76" y="389" class="h">小变更</text><text x="76" y="419" class="b">候选原因更少</text><rect x="292" y="354" width="180" height="96" rx="14" class="good"/><text x="316" y="389" class="h">快速 CI</text><text x="316" y="419" class="b">上下文仍然完整</text><rect x="532" y="354" width="180" height="96" rx="14" class="good"/><text x="556" y="389" class="h">同一制品</text><text x="556" y="419" class="b">摘要绑定证据</text><rect x="772" y="354" width="180" height="96" rx="14" class="good"/><text x="796" y="389" class="h">逐级灰度</text><text x="796" y="419" class="b">指标决定放量</text><rect x="1012" y="354" width="136" height="96" rx="14" class="good"/><text x="1032" y="389" class="h">恢复</text><text x="1032" y="419" class="b">预设旧制品</text><path d="M232 402H284M472 402H524M712 402H764M952 402H1004" class="fg"/>
  <rect x="52" y="516" width="1096" height="112" rx="16" fill="#111c33" stroke="#2d4266"/><text x="78" y="553" class="h">它真正优化的四个量</text><text x="78" y="591" class="b">反馈时间 ↓　　每批变更规模 ↓　　生产故障影响半径 ↓　　恢复时间与证据重建成本 ↓</text><text x="52" y="666" class="s">自动化不是取消人，而是把重复判断交给机器，把风险接受、维护窗口与临床状态留给责任人。</text>
</svg>
