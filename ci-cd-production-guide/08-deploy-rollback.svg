<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Windows、Linux 与 Docker 部署回滚模型</title><desc id="desc">三种运行形态共享下载校验、新版本准备、原子切换、健康检查和回滚步骤，仅部署适配器不同。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55aaff"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#fb7185"/></marker><style>text{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#e6edf7}.t{font-size:30px;font-weight:700}.s{font-size:15px;fill:#9fb0c8}.h{font-size:18px;font-weight:700}.b{font-size:14px;fill:#b7c5d9}.lane{font-size:15px;font-weight:700;fill:#55aaff}.n{fill:#111c33;stroke:#2d4266;stroke-width:2}.g{fill:#10283a;stroke:#34d399;stroke-width:2}.bad{fill:#2d1725;stroke:#fb7185;stroke-width:2}.f{stroke:#55aaff;stroke-width:3;fill:none;marker-end:url(#a)}.fr{stroke:#fb7185;stroke-width:3;fill:none;marker-end:url(#r)}</style></defs>
  <rect width="1200" height="760" rx="24" fill="#0b1220"/><text x="52" y="58" class="t">三种运行形态，共用一套部署状态机</text><text x="52" y="88" class="s">差异只在“如何切换运行目标”；摘要校验、健康检查、停止与恢复原则完全一致。</text>
  <rect x="52" y="125" width="166" height="88" rx="14" class="n"/><text x="76" y="161" class="h">下载明确版本</text><text x="76" y="190" class="b">禁止 latest</text><rect x="272" y="125" width="166" height="88" rx="14" class="n"/><text x="296" y="161" class="h">校验制品</text><text x="296" y="190" class="b">digest + 签名</text><rect x="492" y="125" width="166" height="88" rx="14" class="n"/><text x="516" y="161" class="h">准备新版本</text><text x="516" y="190" class="b">不覆盖 current</text><rect x="712" y="125" width="166" height="88" rx="14" class="g"/><text x="736" y="161" class="h">原子切换</text><text x="736" y="190" class="b">保留 previous</text><rect x="932" y="125" width="216" height="88" rx="14" class="g"/><text x="956" y="161" class="h">健康检查与观察</text><text x="956" y="190" class="b">决定放量或恢复</text><path d="M218 169H264M438 169H484M658 169H704M878 169H924" class="f"/>
  <text x="52" y="278" class="lane">WINDOWS</text><rect x="160" y="246" width="260" height="92" rx="14" class="n"/><text x="184" y="282" class="h">releases\1.8.0</text><text x="184" y="312" class="b">current junction → 新目录</text><rect x="466" y="246" width="260" height="92" rx="14" class="g"/><text x="490" y="282" class="h">Windows Service</text><text x="490" y="312" class="b">Stop → 切换 → Start</text><rect x="772" y="246" width="376" height="92" rx="14" class="bad"/><text x="796" y="282" class="h">失败：junction 切回 previous</text><text x="796" y="312" class="b">重新启动旧服务并验证</text>
  <text x="52" y="409" class="lane">LINUX</text><rect x="160" y="377" width="260" height="92" rx="14" class="n"/><text x="184" y="413" class="h">releases/1.8.0</text><text x="184" y="443" class="b">current symlink → 新目录</text><rect x="466" y="377" width="260" height="92" rx="14" class="g"/><text x="490" y="413" class="h">systemd</text><text x="490" y="443" class="b">原子链接 + restart</text><rect x="772" y="377" width="376" height="92" rx="14" class="bad"/><text x="796" y="413" class="h">失败：symlink 切回 previous</text><text x="796" y="443" class="b">重启旧版本并检查依赖</text>
  <text x="52" y="540" class="lane">DOCKER</text><rect x="160" y="508" width="260" height="92" rx="14" class="n"/><text x="184" y="544" class="h">image@sha256:new</text><text x="184" y="574" class="b">先拉取并验证 digest</text><rect x="466" y="508" width="260" height="92" rx="14" class="g"/><text x="490" y="544" class="h">启动新实例</text><text x="490" y="574" class="b">健康后切流量</text><rect x="772" y="508" width="376" height="92" rx="14" class="bad"/><text x="796" y="544" class="h">失败：流量切回 old digest</text><text x="796" y="574" class="b">数据格式必须向后兼容</text>
  <path d="M420 292H458M726 292H764M420 423H458M726 423H764M420 554H458M726 554H764" class="f"/>
  <rect x="52" y="660" width="1096" height="56" rx="14" class="n"/><text x="78" y="695" class="h">真正的回滚对象 = 代码制品 + 配置 + 数据兼容 + 流量状态；不是只把 Git 指针移回去</text>
</svg>
