<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">远程手术与医疗设备发布增强门禁</title><desc id="desc">普通软件门禁之上增加硬件在环、签名兼容、双人审批、非手术窗口、现场接管和离线恢复。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#34d399"/></marker><style>text{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#e6edf7}.t{font-size:30px;font-weight:700}.s{font-size:15px;fill:#9fb0c8}.h{font-size:19px;font-weight:700}.b{font-size:14px;fill:#b7c5d9}.n{fill:#111c33;stroke:#2d4266;stroke-width:2}.g{fill:#10283a;stroke:#34d399;stroke-width:2}.p{fill:#211b3b;stroke:#a78bfa;stroke-width:2}.f{stroke:#34d399;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="740" rx="24" fill="#0b1220"/><text x="52" y="58" class="t">医疗/机器人软件：自动化准备发布，人承担风险决策</text><text x="52" y="88" class="s">普通软件质量门是下限；控制系统还必须证明硬件兼容、临床窗口、安全接管与离线恢复。</text>
  <text x="52" y="137" class="s">通用自动门禁</text>
  <rect x="52" y="156" width="190" height="102" rx="15" class="n"/><text x="76" y="193" class="h">代码质量</text><text x="76" y="224" class="b">审查、单测、SAST</text><rect x="282" y="156" width="190" height="102" rx="15" class="n"/><text x="306" y="193" class="h">跨平台构建</text><text x="306" y="224" class="b">Windows/Linux/Docker</text><rect x="512" y="156" width="190" height="102" rx="15" class="n"/><text x="536" y="193" class="h">不可变制品</text><text x="536" y="224" class="b">digest、SBOM、签名</text><path d="M242 207H274M472 207H504" class="f"/>
  <text x="52" y="322" class="s">医疗设备增强门禁</text>
  <rect x="52" y="341" width="190" height="116" rx="15" class="p"/><text x="76" y="378" class="h">SIL / HIL</text><text x="76" y="409" class="b">真实驱动与硬件台架</text><text x="76" y="435" class="b">延迟、断链、急停</text><rect x="282" y="341" width="190" height="116" rx="15" class="p"/><text x="306" y="378" class="h">兼容与升级</text><text x="306" y="409" class="b">型号、revision、bootloader</text><text x="306" y="435" class="b">升级失败自动恢复</text><rect x="512" y="341" width="190" height="116" rx="15" class="p"/><text x="536" y="378" class="h">双人职责分离</text><text x="536" y="409" class="b">非作者技术复核</text><text x="536" y="435" class="b">发布风险批准</text><rect x="742" y="341" width="190" height="116" rx="15" class="p"/><text x="766" y="378" class="h">临床状态门</text><text x="766" y="409" class="b">非手术维护窗口</text><text x="766" y="435" class="b">现场人员与接管就绪</text><rect x="972" y="341" width="176" height="116" rx="15" class="p"/><text x="996" y="378" class="h">离线恢复</text><text x="996" y="409" class="b">USB 签名包</text><text x="996" y="435" class="b">旧版本可获取</text><path d="M242 399H274M472 399H504M702 399H734M932 399H964" class="f"/>
  <rect x="742" y="156" width="406" height="102" rx="15" class="g"/><text x="766" y="193" class="h">发布候选已准备，但尚未授权改变临床设备</text><text x="766" y="224" class="b">自动测试通过 ≠ 当前时刻允许部署</text><path d="M702 207H734" class="f"/>
  <rect x="52" y="522" width="1096" height="110" rx="16" class="g"/><text x="78" y="560" class="h">最终发布条件</text><text x="78" y="595" class="b">签名制品通过 HIL　+　目标设备兼容　+　当前不是手术状态　+　双人批准　+　现场接管和离线恢复可用</text>
  <text x="52" y="686" class="s">硬件急停与安全回路独立于 CI/CD、容器和云端；发布系统失败不能削弱设备的本地安全能力。</text>
</svg>
