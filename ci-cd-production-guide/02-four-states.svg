<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">CI/CD 的四种状态与证据主键</title><desc id="desc">源码、构建、制品和运行是四种不同状态，各自需要不同的身份主键，生产追溯将它们双向连接。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55aaff"/></marker><style>text{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#e6edf7}.t{font-size:30px;font-weight:700}.s{font-size:15px;fill:#9fb0c8}.h{font-size:21px;font-weight:700}.b{font-size:15px;fill:#b7c5d9}.k{font:15px Consolas,monospace;fill:#fbbf24}.n{fill:#111c33;stroke:#2d4266;stroke-width:2}.g{fill:#10283a;stroke:#34d399;stroke-width:2}.f{stroke:#55aaff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="700" rx="24" fill="#0b1220"/><text x="52" y="58" class="t">四种状态不能混为一谈</text><text x="52" y="88" class="s">“代码通过”“包已生成”“已经部署”“业务正常”是四个不同事实。</text>
  <rect x="52" y="145" width="240" height="190" rx="18" class="n"/><text x="78" y="188" class="h">① 源码状态</text><text x="78" y="225" class="b">代码、依赖锁、构建描述</text><text x="78" y="263" class="s">主键</text><text x="78" y="292" class="k">commit SHA</text>
  <rect x="338" y="145" width="240" height="190" rx="18" class="n"/><text x="364" y="188" class="h">② 构建状态</text><text x="364" y="225" class="b">Runner、SDK、参数、日志</text><text x="364" y="263" class="s">主键</text><text x="364" y="292" class="k">pipeline / job ID</text>
  <rect x="624" y="145" width="240" height="190" rx="18" fill="#211b3b" stroke="#a78bfa" stroke-width="2"/><text x="650" y="188" class="h">③ 制品状态</text><text x="650" y="225" class="b">ZIP、MSI、tar、固件、镜像</text><text x="650" y="263" class="s">主键</text><text x="650" y="292" class="k">SHA-256 / digest</text>
  <rect x="910" y="145" width="238" height="190" rx="18" class="g"/><text x="936" y="188" class="h">④ 运行状态</text><text x="936" y="225" class="b">实例、配置、数据库版本</text><text x="936" y="263" class="s">主键</text><text x="936" y="292" class="k">deployment ID</text><path d="M292 240H330M578 240H616M864 240H902" class="f"/>
  <rect x="52" y="392" width="1096" height="212" rx="18" class="n"/><text x="78" y="432" class="h">生产级双向追溯</text><text x="98" y="479" class="k">生产实例</text><text x="228" y="479" class="b">→ deployment ID → artifact digest → build job → commit SHA → PR/MR</text><text x="98" y="526" class="k">commit SHA</text><text x="228" y="526" class="b">→ build job → artifact digest → 部署记录 → 哪些实例仍在运行</text><line x1="78" y1="554" x2="1120" y2="554" stroke="#2d4266"/><text x="78" y="584" class="s">文件名和版本标签方便人阅读；摘要与部署 ID 才是机器可验证的事实主键。</text>
  <text x="52" y="654" class="b">常见误区：tag ≠ 已构建　｜　已上传 ≠ 已部署　｜　已部署 ≠ 健康　｜　Git 回退 ≠ 生产状态恢复</text>
</svg>
