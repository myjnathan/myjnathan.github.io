<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Git 的三棵树与对象模型</title>
  <desc id="desc">展示 HEAD、暂存区、工作区三种状态，以及提交对象如何指向树和文件内容。</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#55aaff"/></marker>
    <style>text{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#e6edf7}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#9fb0c8}.h{font-size:20px;font-weight:700}.b{font-size:15px;fill:#b7c5d9}.cmd{font:14px Consolas,monospace;fill:#fbbf24}.box{fill:#111c33;stroke:#2d4266;stroke-width:2}.blue{fill:#10243b;stroke:#55aaff;stroke-width:2}.green{fill:#102b29;stroke:#34d399;stroke-width:2}.purple{fill:#211b3a;stroke:#a78bfa;stroke-width:2}.arrow{stroke:#55aaff;stroke-width:3;fill:none;marker-end:url(#a)}.thin{stroke:#526987;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#0b1220"/>
  <text x="54" y="58" class="title">心智模型：先知道“哪棵树”在变，再选择命令</text>
  <text x="54" y="88" class="sub">大多数 Git 事故不是命令记错，而是没有分清工作区、索引、HEAD 与远端引用。</text>

  <rect x="54" y="142" width="250" height="174" rx="16" class="box"/>
  <text x="80" y="181" class="h">工作区 Working Tree</text><text x="80" y="215" class="b">你正在编辑的文件系统</text><text x="80" y="247" class="cmd">git diff</text><text x="80" y="279" class="b">状态可丢弃，也可选择性暂存</text>
  <rect x="370" y="142" width="250" height="174" rx="16" class="blue"/>
  <text x="396" y="181" class="h">索引 Index</text><text x="396" y="215" class="b">下一次提交的候选快照</text><text x="396" y="247" class="cmd">git diff --staged</text><text x="396" y="279" class="b">代码评审应从这里开始</text>
  <rect x="686" y="142" width="250" height="174" rx="16" class="green"/>
  <text x="712" y="181" class="h">HEAD / 当前提交</text><text x="712" y="215" class="b">分支引用指向的已存快照</text><text x="712" y="247" class="cmd">git show HEAD</text><text x="712" y="279" class="b">已发布历史的本地基线</text>
  <path d="M304 226H362" class="arrow"/><text x="318" y="211" class="cmd">add</text>
  <path d="M620 226H678" class="arrow"/><text x="628" y="211" class="cmd">commit</text>
  <path d="M686 288C658 347 339 347 304 288" class="thin"/><text x="452" y="350" class="cmd">restore / reset 影响不同层</text>

  <text x="54" y="413" class="h">提交不是“文件差异”，而是带父指针的完整快照</text>
  <rect x="54" y="451" width="188" height="166" rx="16" class="purple"/>
  <text x="78" y="488" class="h">ref: main</text><text x="78" y="520" class="cmd">refs/heads/main</text><text x="78" y="558" class="b">可移动指针</text><text x="78" y="586" class="b">不是对象本身</text>
  <rect x="306" y="451" width="210" height="166" rx="16" class="green"/>
  <text x="330" y="488" class="h">commit</text><text x="330" y="520" class="b">作者 / 时间 / 消息</text><text x="330" y="552" class="b">parent → 上一提交</text><text x="330" y="584" class="b">tree → 项目快照</text>
  <rect x="580" y="451" width="210" height="166" rx="16" class="blue"/>
  <text x="604" y="488" class="h">tree</text><text x="604" y="520" class="b">路径、权限、对象 ID</text><text x="604" y="552" class="b">目录 → 子 tree</text><text x="604" y="584" class="b">文件 → blob</text>
  <rect x="854" y="451" width="210" height="166" rx="16" class="box"/>
  <text x="878" y="488" class="h">blob</text><text x="878" y="520" class="b">文件内容</text><text x="878" y="552" class="b">内容寻址</text><text x="878" y="584" class="b">不保存文件名</text>
  <path d="M242 534H298" class="arrow"/><path d="M516 534H572" class="arrow"/><path d="M790 534H846" class="arrow"/>
  <rect x="54" y="656" width="1010" height="38" rx="10" fill="#172237"/><text x="74" y="681" class="b">判断口诀：改内容看工作区；选提交看索引；改历史看引用与提交图；协作前先看远端跟踪分支。</text>
</svg>
