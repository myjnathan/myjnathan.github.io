<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Git 撤销与恢复地图</title><desc id="desc">按变更所在层级和是否已共享，选择 restore、reset、commit amend、revert、reflog 或 cherry-pick。</desc>
  <style>text{font-family:Inter,"Microsoft YaHei",sans-serif;fill:#e6edf7}.title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#9fb0c8}.axis{font-size:15px;font-weight:700;fill:#55aaff}.h{font-size:18px;font-weight:700}.b{font-size:14px;fill:#b7c5d9}.cmd{font:13px Consolas,monospace;fill:#fbbf24}.cell{fill:#111c33;stroke:#2d4266;stroke-width:2}.safe{fill:#102b29;stroke:#34d399;stroke-width:2}.warn{fill:#2d2816;stroke:#fbbf24;stroke-width:2}.risk{fill:#311c2b;stroke:#fb7185;stroke-width:2}.grid{stroke:#344565;stroke-width:1}</style>
  <rect width="1200" height="780" rx="24" fill="#0b1220"/>
  <text x="54" y="58" class="title">恢复地图：先定位损失发生在哪一层，再决定是否改写历史</text><text x="54" y="88" class="sub">绿 = 通常安全；黄 = 只适合本地未共享历史；红 = 破坏性操作，必须确认目标并准备恢复点。</text>
  <text x="54" y="144" class="axis">问题位置</text><text x="340" y="144" class="axis">未提交 / 未共享</text><text x="700" y="144" class="axis">已经推送 / 其他人可能依赖</text>
  <line x1="300" y1="160" x2="300" y2="668" class="grid"/><line x1="656" y1="160" x2="656" y2="668" class="grid"/>

  <rect x="54" y="170" width="220" height="112" rx="14" class="cell"/><text x="78" y="210" class="h">工作区改坏</text><text x="78" y="241" class="b">还没 git add</text>
  <rect x="326" y="170" width="300" height="112" rx="14" class="safe"/><text x="350" y="207" class="cmd">git restore &lt;path&gt;</text><text x="350" y="239" class="b">丢弃指定文件的未暂存改动</text>
  <rect x="682" y="170" width="464" height="112" rx="14" class="safe"/><text x="706" y="207" class="cmd">新提交修复；不要改远端旧提交</text><text x="706" y="239" class="b">若密钥已暴露：先轮换，再清理历史</text>

  <rect x="54" y="304" width="220" height="112" rx="14" class="cell"/><text x="78" y="344" class="h">暂存选错</text><text x="78" y="375" class="b">已 add，未 commit</text>
  <rect x="326" y="304" width="300" height="112" rx="14" class="safe"/><text x="350" y="341" class="cmd">git restore --staged &lt;path&gt;</text><text x="350" y="373" class="b">移出索引，保留工作区内容</text>
  <rect x="682" y="304" width="464" height="112" rx="14" class="safe"/><text x="706" y="341" class="cmd">同左：暂存区尚未共享</text><text x="706" y="373" class="b">重新拆分后再提交</text>

  <rect x="54" y="438" width="220" height="112" rx="14" class="cell"/><text x="78" y="478" class="h">最近提交有误</text><text x="78" y="509" class="b">消息/漏文件/拆分</text>
  <rect x="326" y="438" width="300" height="112" rx="14" class="warn"/><text x="350" y="475" class="cmd">commit --amend / reset</text><text x="350" y="507" class="b">只改自己的未共享历史</text>
  <rect x="682" y="438" width="464" height="112" rx="14" class="safe"/><text x="706" y="475" class="cmd">git revert &lt;bad-sha&gt;</text><text x="706" y="507" class="b">追加反向提交，保留审计链</text>

  <rect x="54" y="572" width="220" height="112" rx="14" class="cell"/><text x="78" y="612" class="h">提交“消失”</text><text x="78" y="643" class="b">误 reset / rebase</text>
  <rect x="326" y="572" width="300" height="112" rx="14" class="warn"/><text x="350" y="609" class="cmd">git reflog → branch rescue</text><text x="350" y="641" class="b">先建立恢复分支，再继续操作</text>
  <rect x="682" y="572" width="464" height="112" rx="14" class="safe"/><text x="706" y="609" class="cmd">revert / cherry-pick 到修复分支</text><text x="706" y="641" class="b">不要强推受保护分支</text>

  <rect x="54" y="710" width="1092" height="44" rx="10" class="risk"/><text x="78" y="739" class="b">高危区：git reset --hard 与 git clean 会直接丢弃本地状态；执行前先 status、diff、reflog，并建立 rescue 分支。</text>
</svg>
